<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1000 260"
     width="1000"
     height="260">

  <defs>

    <linearGradient id="bg"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1">

      <stop offset="0%" stop-color="#0f0b1f"/>
      <stop offset="100%" stop-color="#17102d"/>

    </linearGradient>

    <linearGradient id="badge"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1">

      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>

    </linearGradient>

  </defs>

  <rect
    width="1000"
    height="260"
    rx="18"
    fill="url(#bg)"/>

  <rect
    x="1"
    y="1"
    width="998"
    height="258"
    rx="17"
    fill="none"
    stroke="#8b5cf6"
    stroke-opacity=".45"/>

  <text
    x="500"
    y="42"
    text-anchor="middle"
    fill="#c084fc"
    font-family="Arial"
    font-size="23"
    font-weight="700">

    ✦ Developer Highlights ✦

  </text>

  <!-- Badge 1 -->

  <circle
    cx="160"
    cy="135"
    r="55"
    fill="url(#badge)"
    opacity=".9"/>

  <text
    x="160"
    y="130"
    text-anchor="middle"
    fill="white"
    font-family="Arial"
    font-size="22"
    font-weight="800">
    AI
  </text>

  <text
    x="160"
    y="153"
    text-anchor="middle"
    fill="#f5f3ff"
    font-family="monospace"
    font-size="11">
    BUILDER
  </text>

  <!-- Badge 2 -->

  <circle
    cx="390"
    cy="135"
    r="55"
    fill="#172554"
    stroke="#22d3ee"
    stroke-width="3"/>

  <text
    x="390"
    y="130"
    text-anchor="middle"
    fill="#67e8f9"
    font-family="Arial"
    font-size="22"
    font-weight="800">
    ☁
  </text>

  <text
    x="390"
    y="153"
    text-anchor="middle"
    fill="#e0f2fe"
    font-family="monospace"
    font-size="11">
    CLOUD
  </text>

  <!-- Badge 3 -->

  <circle
    cx="610"
    cy="135"
    r="55"
    fill="#1e1b4b"
    stroke="#a78bfa"
    stroke-width="3"/>

  <text
    x="610"
    y="130"
    text-anchor="middle"
    fill="#c4b5fd"
    font-family="Arial"
    font-size="22"
    font-weight="800">
    &lt;/&gt;
  </text>

  <text
    x="610"
    y="153"
    text-anchor="middle"
    fill="#ede9fe"
    font-family="monospace"
    font-size="11">
    FULL STACK
  </text>

  <!-- Badge 4 -->

  <circle
    cx="840"
    cy="135"
    r="55"
    fill="#3b0a2e"
    stroke="#ec4899"
    stroke-width="3"/>

  <text
    x="840"
    y="130"
    text-anchor="middle"
    fill="#f9a8d4"
    font-family="Arial"
    font-size="22"
    font-weight="800">
    ∑
  </text>

  <text
    x="840"
    y="153"
    text-anchor="middle"
    fill="#fce7f3"
    font-family="monospace"
    font-size="11">
    DATA
  </text>

</svg>
