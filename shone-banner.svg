<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 340"
     width="1200"
     height="340">

  <defs>
    <linearGradient id="name" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e879f9"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>

    <clipPath id="revealTag">
      <rect x="60" y="70" width="0" height="55">
        <animate
          attributeName="width"
          from="0"
          to="700"
          dur="1.4s"
          begin="0s"
          fill="freeze"/>
      </rect>
    </clipPath>

    <clipPath id="revealName">
      <rect x="60" y="115" width="0" height="75">
        <animate
          attributeName="width"
          from="0"
          to="700"
          dur="1.3s"
          begin="1.5s"
          fill="freeze"/>
      </rect>
    </clipPath>

    <clipPath id="revealRole">
      <rect x="60" y="190" width="0" height="45">
        <animate
          attributeName="width"
          from="0"
          to="760"
          dur="1.3s"
          begin="2.9s"
          fill="freeze"/>
      </rect>
    </clipPath>

    <clipPath id="revealFocus">
      <rect x="60" y="235" width="0" height="40">
        <animate
          attributeName="width"
          from="0"
          to="450"
          dur="1s"
          begin="4.3s"
          fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="340" rx="18" fill="#0b0b12"/>

  <!-- Decorative glow -->
  <circle cx="1050" cy="80" r="130" fill="#8b5cf6" opacity="0.06"/>
  <circle cx="150" cy="300" r="130" fill="#ec4899" opacity="0.04"/>

  <!-- Terminal -->
  <text
    x="60"
    y="42"
    fill="#22c55e"
    font-family="monospace"
    font-size="16">
    shone@github:~$
  </text>

  <text
    x="210"
    y="42"
    fill="#67e8f9"
    font-family="monospace"
    font-size="16">
    ./initialize.sh
  </text>

  <!-- Blinking cursor -->
  <rect
    x="360"
    y="28"
    width="9"
    height="20"
    fill="#67e8f9">
    <animate
      attributeName="opacity"
      values="1;0;1"
      dur="0.75s"
      repeatCount="indefinite"/>
  </rect>

  <!-- Tagline -->
  <g clip-path="url(#revealTag)">
    <text
      x="60"
      y="108"
      fill="#f1f5f9"
      font-family="Arial, sans-serif"
      font-size="34"
      font-weight="700">
      Build. Deploy. Improve. Repeat.
    </text>
  </g>

  <!-- Name -->
  <g clip-path="url(#revealName)">
    <text
      x="60"
      y="175"
      fill="url(#name)"
      font-family="Arial, sans-serif"
      font-size="62"
      font-weight="800">
      SHONE YOHANNAN
    </text>
  </g>


  <!-- Designation -->
  <g clip-path="url(#revealRole)">
    <text
      x="60"
      y="222"
      fill="#e2e8f0"
      font-family="monospace"
      font-size="23">
      B.Tech Artificial Intelligence &amp; Data Science Student
    </text>
  </g>

  <!-- Focus -->
  <g clip-path="url(#revealFocus)">
    <text
      x="60"
      y="268"
      fill="#94a3b8"
      font-family="monospace"
      font-size="17">
      AI • Cloud • Full Stack • Data
    </text>
  </g>

  <!-- Bottom line -->
  <line
    x1="60"
    y1="305"
    x2="1140"
    y2="305"
    stroke="#8b5cf6"
    stroke-opacity="0.3"/>

  <text
    x="60"
    y="325"
    fill="#64748b"
    font-family="monospace"
    font-size="12">
    shone@github AI/ML • Data Science • Full-Stack • Cloud
  </text>

</svg>
