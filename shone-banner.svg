<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 330"
     width="1200"
     height="330">

  <defs>
    <linearGradient id="nameGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e879f9"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="nameReveal">
      <rect x="60" y="115" width="0" height="90">
        <animate
          attributeName="width"
          from="0"
          to="790"
          dur="2.8s"
          begin="0.4s"
          fill="freeze"/>
      </rect>
    </clipPath>

    <clipPath id="roleReveal">
      <rect x="62" y="205" width="0" height="45">
        <animate
          attributeName="width"
          from="0"
          to="620"
          dur="2.2s"
          begin="3.2s"
          fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="1200" height="330" rx="18" fill="#0d0b18"/>

  <circle cx="1060" cy="70" r="140" fill="#7c3aed" opacity=".07"/>
  <circle cx="120" cy="290" r="160" fill="#ec4899" opacity=".04"/>

  <!-- Terminal -->
  <text x="70" y="52"
        fill="#22c55e"
        font-family="monospace"
        font-size="17">
    shone@github:~$
  </text>

  <text x="235" y="52"
        fill="#67e8f9"
        font-family="monospace"
        font-size="17">
    cat README.md
  </text>

  <rect x="390" y="36"
        width="9"
        height="22"
        fill="#67e8f9">
    <animate
      attributeName="opacity"
      values="1;0;1"
      dur=".8s"
      repeatCount="indefinite"/>
  </rect>

  <!-- Greeting -->
  <text x="70" y="98"
        fill="#e2e8f0"
        font-family="Arial, sans-serif"
        font-size="21">
    Hello! I'm
  </text>

  <!-- Name -->
  <g clip-path="url(#nameReveal)">
    <text x="65" y="185"
          fill="url(#nameGradient)"
          font-family="Arial, sans-serif"
          font-size="72"
          font-weight="800"
          filter="url(#glow)">
      SHONE YOHANNAN
    </text>
  </g>

  <!-- Designation -->
  <g clip-path="url(#roleReveal)">
    <text x="67" y="235"
          fill="#c084fc"
          font-family="monospace"
          font-size="24">
      AI &amp; DATA SCIENCE ENGINEER
    </text>
  </g>

  <!-- Typing cursor -->
  <rect x="710" y="208"
        width="7"
        height="30"
        fill="#67e8f9">
    <animate
      attributeName="opacity"
      values="1;0;1"
      dur=".75s"
      begin="3.2s"
      repeatCount="indefinite"/>
  </rect>

  <!-- Tagline -->
  <text x="67" y="278"
        fill="#94a3b8"
        font-family="monospace"
        font-size="16">
    AI • CLOUD • DATA • FULL STACK
  </text>

  <line x1="67" y1="300"
        x2="1130" y2="300"
        stroke="#8b5cf6"
        stroke-opacity=".25"/>

  <text x="67" y="320"
        fill="#64748b"
        font-family="monospace"
        font-size="12">
    building • learning • experimenting
  </text>

</svg>
