<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 360"
     width="1200"
     height="360">

  <defs>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>

    <clipPath id="nameReveal">
      <rect x="70" y="0" width="0" height="90">
        <animate
          attributeName="width"
          from="0"
          to="760"
          dur="2.7s"
          begin="1s"
          fill="freeze"/>
      </rect>
    </clipPath>

    <clipPath id="roleReveal">
      <rect x="72" y="0" width="0" height="50">
        <animate
          attributeName="width"
          from="0"
          to="720"
          dur="2.5s"
          begin="3.7s"
          fill="freeze"/>
      </rect>
    </clipPath>

    <clipPath id="focusReveal">
      <rect x="72" y="0" width="0" height="40">
        <animate
          attributeName="width"
          from="0"
          to="520"
          dur="2s"
          begin="6.3s"
          fill="freeze"/>
      </rect>
    </clipPath>

  </defs>

  <!-- Background -->
  <rect
    width="1200"
    height="360"
    rx="20"
    fill="#0b0b12"/>

  <!-- Subtle background glow -->
  <circle
    cx="1030"
    cy="90"
    r="150"
    fill="#8b5cf6"
    opacity=".05"/>

  <circle
    cx="160"
    cy="300"
    r="130"
    fill="#60a5fa"
    opacity=".04"/>

  <!-- Terminal prompt -->
  <text
    x="70"
    y="55"
    fill="#22c55e"
    font-family="monospace"
    font-size="17">
    shone@github:~$
  </text>

  <text
    x="235"
    y="55"
    fill="#67e8f9"
    font-family="monospace"
    font-size="17">
    whoami
  </text>

  <!-- Terminal cursor -->
  <rect
    x="310"
    y="39"
    width="10"
    height="22"
    fill="#67e8f9">

    <animate
      attributeName="opacity"
      values="1;0;1"
      dur=".8s"
      repeatCount="indefinite"/>

  </rect>

  <!-- Tagline -->
  <text
    x="70"
    y="105"
    fill="#e2e8f0"
    font-family="Arial, sans-serif"
    font-size="20">

    ⚙ Build. Deploy. Improve. Repeat.

  </text>

  <!-- NAME -->
  <g clip-path="url(#nameReveal)">

    <text
      x="70"
      y="190"
      fill="url(#accent)"
      font-family="Arial, sans-serif"
      font-size="72"
      font-weight="800">

      SHONE YOHANNAN

    </text>

  </g>

  <!-- NAME cursor -->
  <rect
    x="845"
    y="135"
    width="7"
    height="65"
    fill="#a78bfa">

    <animate
      attributeName="opacity"
      values="0;1;0"
      dur=".7s"
      begin="1s"
      repeatCount="4"/>

  </rect>

  <!-- DESIGNATION -->
  <g clip-path="url(#roleReveal)">

    <text
      x="72"
      y="245"
      fill="#c084fc"
      font-family="monospace"
      font-size="25">

      B.Tech Artificial Intelligence &amp; Data Science Student

    </text>

  </g>

  <!-- DESIGNATION cursor -->
  <rect
    x="795"
    y="220"
    width="7"
    height="30"
    fill="#67e8f9">

    <animate
      attributeName="opacity"
      values="0;1;0"
      dur=".75s"
      begin="3.7s"
      repeatCount="5"/>

  </rect>

  <!-- Focus -->
  <g clip-path="url(#focusReveal)">

    <text
      x="72"
      y="292"
      fill="#94a3b8"
      font-family="monospace"
      font-size="17">

      AI • CLOUD • FULL STACK • DATA

    </text>

  </g>

  <!-- Bottom divider -->
  <line
    x1="70"
    y1="325"
    x2="1130"
    y2="325"
    stroke="url(#accent)"
    stroke-opacity=".3"/>

</svg>
