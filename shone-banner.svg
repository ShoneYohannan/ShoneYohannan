```svg
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 380"
     width="1200"
     height="380">

  <defs>

    <linearGradient id="titleGradient"
                    x1="0%"
                    y1="0%"
                    x2="100%"
                    y2="0%">

      <stop offset="0%" stop-color="#e879f9"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#60a5fa"/>

    </linearGradient>

    <linearGradient id="lineGradient"
                    x1="0%"
                    y1="0%"
                    x2="100%"
                    y2="0%">

      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#60a5fa"/>

    </linearGradient>

    <!-- Build. Deploy. Improve. Repeat. -->
    <clipPath id="taglineClip">
      <rect x="170" y="55" width="0" height="60">

        <animate
          attributeName="width"
          from="0"
          to="860"
          dur="1.4s"
          begin="0.2s"
          fill="freeze"/>

      </rect>
    </clipPath>

    <!-- Name -->
    <clipPath id="nameClip">
      <rect x="300" y="125" width="0" height="80">

        <animate
          attributeName="width"
          from="0"
          to="600"
          dur="1.3s"
          begin="1.7s"
          fill="freeze"/>

      </rect>
    </clipPath>

    <!-- Designation -->
    <clipPath id="roleClip">
      <rect x="170" y="205" width="0" height="55">

        <animate
          attributeName="width"
          from="0"
          to="860"
          dur="1.3s"
          begin="3.1s"
          fill="freeze"/>

      </rect>
    </clipPath>

    <!-- Focus -->
    <clipPath id="focusClip">
      <rect x="380" y="265" width="0" height="40">

        <animate
          attributeName="width"
          from="0"
          to="450"
          dur="1s"
          begin="4.6s"
          fill="freeze"/>

      </rect>
    </clipPath>

  </defs>


  <!-- Background -->

  <rect
